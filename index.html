<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mapa e painel de coleções de camisas de futebol: Daniele Mureddu, Roberto Baigorria e Anderson Borges.">
<title>ShirtVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

<style>
/* Layout: sticky kit-room header, then one working view at a time (dashboard / collection / explore / new shirt). */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eceef4; --line:#d9dce6;
  --ink:#141b33; --muted:#5b6380; --accent:#c8202f; --accent-ink:#ffffff; --accent-soft:#fbe4e6;
  --good:#1f7a4d; --warn:#a86400; --sea:#e6eaf2; --land:#d3d8e4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1222; --surface:#171c30; --surface-2:#20263d; --line:#2e3552;
  --ink:#e9ecf5; --muted:#9aa2bf; --accent:#ff5a63; --accent-ink:#1a0306; --accent-soft:#3a1a22;
  --good:#5cc994; --warn:#f0b35a; --sea:#121730; --land:#2a3150; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#171c30; --surface-2:#20263d; --line:#2e3552;
  --ink:#e9ecf5; --muted:#9aa2bf; --accent:#ff5a63; --accent-ink:#1a0306; --accent-soft:#3a1a22;
  --good:#5cc994; --warn:#f0b35a; --sea:#121730; --land:#2a3150; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.logo b{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px;font-size:18px;line-height:26px}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:8px}
nav a:hover{color:var(--ink);background:var(--surface-2)}
nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--accent)}
.right{display:flex;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding-block:24px 48px}
h1{font-family:var(--display);font-size:clamp(30px,4vw,42px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--display);font-size:22px;margin:0 0 12px;letter-spacing:.03em;text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.owner{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.red{background:var(--accent-soft);color:var(--accent)}
.pill.green{color:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.bars{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:minmax(0,9em) 1fr 3em;gap:10px;align-items:center;font-size:13px}
.brow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .t{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.brow .t,.brow .f{display:block}
.brow .f{height:100%;background:var(--ink);border-radius:3px}
.brow:first-child .f{background:var(--accent)}
.brow .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.col .f{width:100%;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}
.col .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.col .n{font-size:11px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tools input[type=search]{flex:1 1 220px}
.count{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--muted)}
.card .art{background:var(--surface-2);border-radius:8px;display:grid;place-items:center;aspect-ratio:1/1;max-width:100%}
.card .art svg{width:72%;height:auto}
.card .club{font-weight:600;line-height:1.25}
.card .meta{color:var(--muted);font-size:12px}
.card .tags{display:flex;gap:4px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums}
.more{display:flex;justify-content:center;margin-top:16px}
.collectors{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.collector{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.collector:hover{border-color:var(--muted)}
.collector .who{font-weight:600}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted);margin-bottom:16px}
form.shirt{display:grid;gap:18px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
legend{font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:0 6px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.full{grid-column:1/-1}
label input,label select,label textarea{color:var(--ink);font-size:14px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;grid-column:1/-1}
.checks label{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.formfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:20}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgb(10 12 25/.55)}
.dlg{padding:20px;display:grid;gap:16px}
.dlg-top{display:flex;gap:16px;align-items:flex-start}
.dlg-top .art{width:110px;flex:none;background:var(--surface-2);border-radius:10px;padding:10px}
.attrs{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px;margin:0}
.attrs dt{color:var(--muted)}
.attrs dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hyfe{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.hyfe h3{margin:0 0 4px;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.hyfe p{margin:0 0 10px;color:var(--muted);font-size:12px}
.hrow{display:grid;grid-template-columns:7.5em 1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.hrow .k{color:var(--muted)}
.hrow .x{min-width:0;overflow-wrap:anywhere}
.hrow button{font-size:12px;padding:3px 8px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .sea{fill:var(--sea)}
.mapbox path.c{fill:var(--land);stroke:var(--surface);stroke-width:.4;transition:fill .15s}
.mapbox path.c.l1{fill:color-mix(in srgb,var(--accent) 22%,var(--land))}
.mapbox path.c.l2{fill:color-mix(in srgb,var(--accent) 42%,var(--land))}
.mapbox path.c.l3{fill:color-mix(in srgb,var(--accent) 62%,var(--land))}
.mapbox path.c.l4{fill:color-mix(in srgb,var(--accent) 82%,var(--land))}
.mapbox path.c.l5{fill:var(--accent)}
.mapbox path.c[data-k]{cursor:pointer}
.mapbox path.c[data-k]:hover{stroke:var(--ink);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:3}
.tip b{font-family:var(--display);font-size:18px;margin-left:6px}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:8px 8px 4px;flex-wrap:wrap}
.legend i{width:22px;height:10px;border-radius:2px;display:inline-block}
.side{display:grid;gap:16px;min-width:0}
.rank button{all:unset;cursor:pointer;display:grid;grid-template-columns:1.6em minmax(0,1fr) 3em;gap:8px;align-items:center;padding:5px 4px;border-radius:6px;width:100%;box-sizing:border-box;font-size:13px}
.rank button:hover,.rank button:focus-visible{background:var(--surface-2)}
.rank .pos{color:var(--muted);font-variant-numeric:tabular-nums}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .ct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.segb{border:0;background:transparent;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.mapleft{display:grid;gap:16px;min-width:0}
.cfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cfcard{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.cfcard:hover{border-color:var(--accent)}
.cfgrid.many{display:flex;flex-wrap:wrap;gap:6px}
.cfgrid.many .cfcard{padding:4px 6px 4px 10px;border-radius:999px;align-items:center;font-size:13px}
.cfgrid.many .cfcard .cfn{font-weight:500}
.cfgrid.many .cfcard .cfc{font-family:var(--body);font-size:12px;font-weight:700;background:var(--accent-soft);border-radius:999px;padding:0 7px;min-width:1.6em;text-align:center}
.cfcard .cfn{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cfcard .cfc{font-family:var(--display);font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.mapbox circle.cfdot{fill:var(--accent);fill-opacity:.78;stroke:var(--surface);stroke-width:1.2;cursor:pointer}
.mapbox circle.cfdot:hover{fill-opacity:1;stroke:var(--ink);stroke-width:2}
.mapbox path.c.deep{stroke:var(--ink);stroke-width:.9}
.mapbox path.c.sel{stroke:var(--ink);stroke-width:2.5}
.regbox svg{max-height:640px;overflow:hidden}
.regbox path.c{cursor:pointer;stroke-width:.8}
.lgseg{display:flex;flex-wrap:wrap;margin-bottom:16px}
.lgseg .sub{font-weight:500;margin-left:4px}
.cgrid{grid-template-columns:minmax(0,1fr) 340px}
.rank button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600;font-size:13px}
.chip button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:var(--accent);color:var(--accent-ink)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:560px){.bar{gap:8px}nav a{font-size:15px;padding:5px 7px}.kpi .v{font-size:32px}.dlg-top .art{width:80px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="#mapa"><b>#</b>ShirtVault</a>
    <nav id="nav">
      <a href="#mapa" data-i="nav_map">Mapa</a>
      <a href="#painel" data-i="nav_dash">Painel</a>
      <a href="#colecao" data-i="nav_coll">Coleção</a>
      <a href="#explorar" data-i="nav_explore">Explorar</a>
      <a href="#nova" data-i="nav_new">Nova camisa</a>
    </nav>
    <div class="right">
      <select id="lang" aria-label="Idioma / Language">
          <option value="pt">🇧🇷 Português</option>
          <option value="en">🇬🇧 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="it">🇮🇹 Italiano</option>
        </select>
    </div>
  </div>
</header>

<main class="wrap" id="view"><div class="empty">…</div></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

function hue(s){let h=0;for(const c of s||"")h=(h*31+c.charCodeAt(0))>>>0;return h%360}
function jersey(sh){

  const a=c?c[0]:`hsl(${h} 55% 42%)`, b=c?(c[1]||c[0]):`hsl(${(h+30)%360} 50% 30%)`, txt=c?(c[2]||"#ffffff"):"#ffffff";
  const num=esc(String(sh.num||"").slice(0,3))||esc((sh.club||"?").slice(0,2).toUpperCase());
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 12 L42 8 Q50 16 58 8 L70 12 L92 26 L84 42 L74 37 L74 92 L26 92 L26 37 L16 42 L8 26 Z" fill="${a}" stroke="${b}" stroke-width="3" stroke-linejoin="round"/><path d="M42 8 Q50 16 58 8" fill="none" stroke="${b}" stroke-width="4"/><text x="50" y="66" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="26" fill="${txt}">${num}</text></svg>`;

function countBy(arr,fn){const m=new Map();for(const x of arr){const k=fn(x);if(!k)continue;m.set(k,(m.get(k)||0)+1)}return [...m].sort((a,b)=>b[1]-a[1])}

    <label>${esc(t("nick"))}<input id="p_nick" maxlength="40" value="${esc(prof.nick||"")}"></label>
    <label>${esc(t("country"))}<input id="p_country" maxlength="40" value="${esc(prof.country||"")}"></label>
   </fieldset>
   <fieldset><legend>${esc(t("lg_main"))}</legend>
    <label>${esc(t("club"))} *<input id="s_club" required maxlength="80" list="dl_clubs"></label>
    <label>${esc(t("team"))}<select id="s_team">${opt(HY.team)}</select></label>
    <label>${esc(t("league"))}<input id="s_league" maxlength="80" placeholder="Serie A [ITA]"></label>
    <label>${esc(t("season"))}<input id="s_season" maxlength="12" placeholder="2025-2026"></label>
    <label>${esc(t("country"))}<input id="s_country" maxlength="40"></label>
    <label>${esc(t("continent"))}<select id="s_cont">${opt(Object.keys(I18N.pt.cont))}</select></label>
    <label>${esc(t("num"))}<input id="s_num" maxlength="3" inputmode="numeric"></label>
    <label>${esc(t("player"))}<input id="s_player" maxlength="40"></label>
    <label class="full">${esc(t("story"))}<textarea id="s_story" maxlength="2000"></textarea></label>
   </fieldset>
   <fieldset><legend>${esc(t("lg_attr"))}</legend>
    <label>${esc(t("style"))}<select id="s_style">${opt(HY.style)}</select></label>
    <label>${esc(t("version"))}<select id="s_version">${opt(HY.version)}</select></label>
    <label>${esc(t("supplier"))}<input id="s_supplier" maxlength="40" list="dl_supp"></label>
    <label>${esc(t("trading"))}<select id="s_trading">${opt(HY.trading,false)}</select></label>
    <div class="checks"><span style="color:var(--muted);font-size:12px;width:100%">${esc(t("feature"))}</span>${HY.feature.map((f,i)=>`<label><input type="checkbox" id="s_feat${i}" value="${esc(f)}">${esc(f)}</label>`).join("")}</div>
    <div class="full" style="grid-column:1/-1"><span style="color:var(--muted);font-size:12px">${esc(t("colors"))}</span><div class="swatches" id="sw">${HY.colors.map(c=>`<button type="button" class="sw" style="background:${c}" data-c="${c}" aria-pressed="false" aria-label="${c}"></button>`).join("")}</div></div>
   </fieldset>
   <fieldset><legend>${esc(t("lg_priv"))}</legend>
    <label>${esc(t("size"))}<select id="s_size">${opt(HY.size)}</select></label>
    <label>${esc(t("cond"))}<select id="s_cond">${opt(HY.cond)}</select></label>
    <label>${esc(t("bought"))}<input id="s_bought" maxlength="60"></label>
    <label>${esc(t("note"))}<input id="s_note" maxlength="120"></label>
   </fieldset>
   <datalist id="dl_clubs">${countBy(S.demo,x=>x.club).map(x=>`<option value="${esc(x[0])}">`).join("")}</datalist>
   <datalist id="dl_supp">${countBy(S.demo,x=>x.supplier).map(x=>`<option value="${esc(x[0])}">`).join("")}</datalist>
   <div class="formfoot"><button class="btn primary" id="savebtn" type="submit">${esc(t("save"))}</button><span class="sub" id="formmsg"></span></div>
  </form>`;
}

/* ---------- detail dialog ---------- */
function openShirt(id){
  const sh=shirtsFor(S.who).find(x=>x.id===id);if(!sh)return;
  const rows=[...(S.who==="all"?[["collector",nameFor(ownerOf(sh))]]:[]),["name",sh.name],["club",sh.club],["country",cname(sh.country)],["continent",tc(sh.cont)],["season",sh.season],["tier",sh.tier],["league",sh.league],["kind",kindLabel(sh.kind)],["team",sh.team],["supplier",sh.supplier],["style",sh.style],["version",sh.version],["size",sh.size],["cond",sh.cond],["num",sh.num],["player",sh.player],["note",sh.note],["coa",sh.coa],["bought",sh.bought],["trading",sh.trading],["story",sh.story]].filter(r=>r[1]);
  const flock=[sh.num?"#"+sh.num:"",sh.player].filter(Boolean).join(" ");
  const league=sh.league||(sh.tier&&sh.kind==="Club"?`Serie ${sh.tier}${sh.country?" ["+sh.country+"]":""}`:"");
  const hy=[["Name",`${nameFor(ownerOf(sh))} ${sh.club} ${sh.season}`.trim()],["Club",sh.club],["Team",sh.team||(sh.kind==="Club"?"1st Team (M)":"")],["League",league],["Flock",flock],["Season",sh.season],["Style",HY.style.includes(sh.style)?sh.style:hyStyle(sh.style)],["Feature",hyFeatures(sh).join(", ")],["Version",hyVersion(sh)],["Supplier",sh.supplier],["Trading",sh.trading||"Not for sale"],["Story",sh.story||sh.note]].filter(r=>r[1]);
  const canDel=S.db&&S.me&&ownerOf(sh)===S.me;
  const d=document.getElementById("dlg");
  d.innerHTML=`<div class="dlg"><div class="dlg-top"><div class="art">${jersey(sh)}</div><div style="min-width:0;flex:1"><h1 style="font-size:30px">${esc(sh.club)}</h1><p class="sub">${esc([sh.season,sh.style].filter(Boolean).join(" · "))}</p></div><button class="btn" id="dclose">${esc(t("close"))}</button></div>
  <dl class="attrs">${rows.map(([k,v])=>`<dt>${esc(t(k))}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
  <div class="hyfe"><h3>${esc(t("hyfe_t"))}</h3><p>${esc(t("hyfe_p"))}</p>${hy.map(([k,v],i)=>`<div class="hrow"><span class="k">${esc(k)}</span><span class="x" id="hv${i}">${esc(v)}</span><button class="btn" data-copy="hv${i}">${esc(t("copy"))}</button></div>`).join("")}</div>
  ${canDel?`<div><button class="btn" id="ddel" data-id="${esc(sh.id)}">${esc(t("del"))}</button></div>`:""}</div>`;
  d.showModal();
}
document.getElementById("dlg").addEventListener("click",async e=>{
  const d=e.currentTarget;
  if(e.target===d||e.target.id==="dclose"){d.close();return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const el=document.getElementById(cp.dataset.copy);try{await navigator.clipboard.writeText(el.textContent);cp.textContent=t("copied")}catch(err){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(t("copy_fail"))}return}
  if(e.target.id==="ddel"){
    const b=e.target;
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent=t("del_confirm");b.classList.add("primary");return}
    b.disabled=true;
    try{await S.db.doc(`collectors/${S.me}/shirts/${b.dataset.id}`).delete();d.close();toast(t("deleted"))}catch(err){b.disabled=false;toast(err.message||String(err))}
  }
});

/* ---------- render & events ---------- */
const VIEWS={mapa:viewMap,pais:viewCountry,painel:viewDash,colecao:viewColl,explorar:viewExplore,nova:viewNew};
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.getElementById("lang").value=lang;
  document.querySelectorAll("#nav a").forEach(a=>{if(a.getAttribute("href")==="#"+S.view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const v=document.getElementById("view");
  const focusId=document.activeElement&&document.activeElement.id,pos=focusId==="q"?document.activeElement.selectionStart:null;
  v.innerHTML=(VIEWS[S.view]||viewMap)();
  if(focusId){const el=document.getElementById(focusId);if(el&&focusId!=="savebtn"){el.focus();if(pos!=null)el.setSelectionRange(pos,pos)}}
}
function route(){const h=location.hash.slice(1);S.view=VIEWS[h]?h:"mapa";S.limit=60;render()}
addEventListener("hashchange",route);
document.getElementById("lang").addEventListener("change",e=>{lang=e.target.value;try{localStorage.setItem("sv_lang",lang)}catch(err){}render()});
const view=document.getElementById("view");
view.addEventListener("input",e=>{if(e.target.id==="q"){S.filters.q=e.target.value;S.limit=60;render()}});
view.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="who"){S.who=e.target.value;S.filters={q:"",cont:"",style:"",cond:"",supp:"",kind:"",ctry:"",cf:""};S.limit=60;watchCollector(S.who);render()}
  else if(id.startsWith("f_")){const k={f_cont:"cont",f_style:"style",f_cond:"cond",f_supp:"supp",f_kind:"kind"}[id];S.filters[k]=e.target.value;S.limit=60;render()}
});
view.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){openShirt(o.dataset.open);return}
  const kindF=S.mapKind==="nat"?"Nazionale":S.mapKind==="club"?"Club":"";
  const lgb=e.target.closest("[data-lg]");if(lgb){S.cLeague=lgb.dataset.lg;S.cRegion="";S.limit=60;render();return}
  const rg=e.target.closest("[data-reg]");if(rg){S.cRegion=S.cRegion===rg.dataset.reg?"":rg.dataset.reg;S.limit=60;render();return}
  if(e.target.id==="clearreg"){S.cRegion="";render();return}
  const dk=e.target.closest("[data-ctry],path[data-k]");if(dk&&LEAGUES[dk.dataset.ctry||dk.dataset.k]){S.cCode=dk.dataset.ctry||dk.dataset.k;S.cLeague="";S.cRegion="";S.limit=60;location.hash="pais";return}
  const cc=dk;if(cc){S.filters={q:"",cont:"",style:"",cond:"",supp:"",kind:kindF,ctry:cc.dataset.ctry||cc.dataset.k,cf:""};S.limit=60;location.hash="colecao";return}
  const cfb=e.target.closest("[data-cf]");if(cfb){S.filters={q:"",cont:"",style:"",cond:"",supp:"",kind:kindF,ctry:"",cf:cfb.dataset.cf};S.limit=60;location.hash="colecao";return}
  const mmb=e.target.closest("[data-mm]");if(mmb){S.mapMode=mmb.dataset.mm;render();return}
  const zb=e.target.closest("[data-zoom]");if(zb){S.cfZoom=zb.dataset.zoom;render();return}
  const mk=e.target.closest("[data-mk]");if(mk){S.mapKind=mk.dataset.mk;render();return}
  if(e.target.id==="clearcf"){S.filters.cf="";render();return}
  if(e.target.id==="clearctry"){S.filters.ctry="";render();return}
  const w=e.target.closest("[data-who]");if(w){S.who=w.dataset.who;watchCollector(S.who);location.hash="mapa";if(S.view==="mapa")render();return}
  const sw=e.target.closest(".sw");if(sw){const on=sw.getAttribute("aria-pressed")==="true";const n=view.querySelectorAll('.sw[aria-pressed="true"]').length;if(!on&&n>=3)return;sw.setAttribute("aria-pressed",String(!on));return}
  if(e.target.id==="mode"){S.mode=S.mode==="grid"?"table":"grid";try{localStorage.setItem("sv_mode",S.mode)}catch(err){}render()}
  if(e.target.id==="more"){S.limit+=60;render()}
});
view.addEventListener("pointermove",e=>{
  const tip=document.getElementById("tip");if(!tip)return;
  const dot=e.target.closest&&e.target.closest("circle.cfdot");
  if(dot&&e.pointerType!=="touch"){tip.innerHTML=`${esc(cfName(dot.dataset.cf))}<b>${esc(dot.dataset.v)}</b>`;const r=document.getElementById("mapbox").getBoundingClientRect();tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";tip.hidden=false;return}
  const rp=e.target.closest&&e.target.closest("path[data-reg]");
  if(rp&&e.pointerType!=="touch"){const v=(S._regInfo&&S._regInfo.get(rp.dataset.reg))||0;tip.innerHTML=`${esc(rname(rp.dataset.reg))}<b>${v}</b>`;const r=document.getElementById("mapbox").getBoundingClientRect();tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";tip.hidden=false;return}
  const p=e.target.closest&&e.target.closest("path[data-k]");
  if(!p||e.pointerType==="touch"){tip.hidden=true;return}
  const k=p.dataset.k,v=S._mapInfo.by.get(k)||0,sb=S._mapInfo.sub.get(k);
  tip.innerHTML=`${esc(cnameK(k))}<b>${v}</b>`+(sb?`<br><span style="opacity:.8">${[...sb].map(([a,b])=>esc(cnameK(a))+" "+b).join(" · ")}</span>`:"");
  const r=document.getElementById("mapbox").getBoundingClientRect();tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";tip.hidden=false;
});
view.addEventListener("pointerleave",()=>{const tip=document.getElementById("tip");if(tip)tip.hidden=true},true);
view.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr[data-open]"))openShirt(e.target.dataset.open)});
view.addEventListener("submit",async e=>{
  if(e.target.id!=="shirtform")return;e.preventDefault();
  const g=id=>(document.getElementById(id)?.value||"").trim();
  const msg=document.getElementById("formmsg"),btn=document.getElementById("savebtn");
  if(!g("s_club")){msg.textContent=t("need_club");document.getElementById("s_club").focus();return}
  const sh={club:g("s_club"),team:g("s_team"),league:g("s_league"),season:g("s_season"),country:g("s_country"),cont:g("s_cont"),num:g("s_num"),player:g("s_player"),story:g("s_story"),style:g("s_style"),version:g("s_version"),supplier:g("s_supplier"),trading:g("s_trading"),
    features:HY.feature.filter((f,i)=>document.getElementById("s_feat"+i).checked),colors:[...view.querySelectorAll('.sw[aria-pressed="true"]')].map(b=>b.dataset.c),
    size:g("s_size"),cond:g("s_cond"),bought:g("s_bought"),note:g("s_note"),kind:"Club",createdAt:new Date().toISOString()};
  btn.disabled=true;msg.textContent="…";
  try{
    const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,20);
    await S.db.doc(`collectors/${S.me}/shirts/${id}`).set(sh);
    const prof={nick:g("p_nick")||nameFor(S.me),country:g("p_country"),count:S.mine.length+(S.mine.some(x=>x.id===id)?0:1),updatedAt:new Date().toISOString()};
    await S.db.doc(`collectors/${S.me}`).set(prof);
    toast(t("saved"));S.who=S.me;location.hash="colecao";
  }catch(err){msg.textContent=err.message||String(err);btn.disabled=false}
});

/* ---------- data ---------- */
const subs={};
function watchCollector(who){
  if(who==="all"){Object.keys(S.collectors).forEach(watchCollector);return}
  if(S.st[who]||!S.db||subs[who])return;
  subs[who]=S.db.collection(`collectors/${who}/shirts`).onSnapshot(snap=>{
    const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    if(who===S.me)S.mine=list;else S.shirtsOf[who]=list;
    if(S.who===who||S.view==="explorar")render();
  },err=>{});
}
async function boot(){
  render();
  try{CT=await (await fetch("data/countries.json")).json()}catch(e){}
  fetch("data/conifa_points.json").then(r=>r.json()).then(j=>{CFPOS=j;if(S.view==="mapa")render()}).catch(()=>{});
  fetch("data/regions.json").then(r=>r.json()).then(j=>{REG=j;if(S.view==="pais"||S.view==="mapa")render()}).catch(()=>{});
  await Promise.all(STATIC.map(async x=>{try{const d=await (await fetch(x.file)).json();S.st[x.id]=x.id==="demo"?d.map(normDemo):d}catch(e){S.st[x.id]=[]}}));
  S.demo=S.st.demo||[];
  try{const w=await (await fetch("data/world.json")).json();const fc=topojson.feature(w,w.objects.countries);
    const proj=d3.geoNaturalEarth1().fitExtent([[8,8],[952,492]],{type:"Sphere"});const path=d3.geoPath(proj);WPROJ=proj;WFC=fc;
    GEO=fc.features.filter(f=>f.properties.name!=="Antarctica").map(f=>({k:f.id||({Kosovo:"XK"})[f.properties.name]||"",d:path(f)})).filter(g=>g.d);
  }catch(e){GEO=[]}
  route();
  if(!window.claude||!window.claude.use){S.dbState="none";render();return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user){S.dbState="none";render();return}
  S.db=db;S.user=user;
  try{S.me=await user.id()}catch(e){}
  if(!S.me){S.dbState="none";render();return}
  const timer=setTimeout(()=>{if(S.dbState==="loading"){S.dbState="slow";render()}},10000);
  db.collection("collectors").onSnapshot(snap=>{
    const c={};for(const d of snap.docs)c[d.id]=d.data();S.collectors=c;
    if(!snap.metadata.fromCache){clearTimeout(timer);S.dbState="ok"}
    render();
  },err=>{clearTimeout(timer);S.dbState="slow";render()});
  watchCollector(S.me);
  render();
}
boot();
</script>
